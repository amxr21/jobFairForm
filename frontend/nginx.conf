# Serves the built Vite SPA. The app uses BrowserRouter, so a request for a
# client-side route (/my-qr-code) has no matching file on disk — without the
# try_files fallback below, refreshing or deep-linking that URL returns 404.
# vercel.json did this job on Vercel; that file is ignored outside Vercel.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or browsers keep loading an old build's
    # HTML that references asset hashes which no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
